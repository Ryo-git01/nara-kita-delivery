<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <title>奈良北コース 配送先メモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">DELIVERY NOTES</p>
      <h1>配送先検索</h1>
      <p class="subheading">住所から配送メモをすばやく確認</p>
    </header>

    <section id="searchScreen" class="screen">
      <label class="field-label" for="addressSearch">住所検索</label>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="addressSearch" type="search" placeholder="例：奈良県奈良市大宮町" autocomplete="off" autocapitalize="off">
        <button id="clearSearch" class="clear-button" type="button" aria-label="検索を消去" hidden>×</button>
      </div>
      <div class="list-heading">
        <span>検索候補</span>
        <span id="resultCount" class="result-count">住所を入力してください</span>
      </div>
      <div id="suggestions" class="suggestions" aria-live="polite"></div>
      <p class="search-hint">入力するたびに候補を絞り込みます。候補をタップするとメモを表示します。</p>
    </section>

    <section id="detailScreen" class="screen" hidden>
      <button id="backButton" class="back-button" type="button"><span aria-hidden="true">←</span> 検索結果に戻る</button>
      <p class="field-label detail-label">住所</p>
      <h2 id="detailAddress" class="detail-address"></h2>
      <article class="memo-card">
        <h3 id="detailName" class="detail-name"></h3>
        <div id="detailMemo" class="detail-memo"></div>
      </article>
    </section>
    <footer class="app-footer">登録件数 <span id="totalCount">0</span> 件</footer>
  </main>
  <script src="delivery-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
